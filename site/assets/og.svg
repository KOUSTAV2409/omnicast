<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Omnicast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="55%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="none" stroke="#414868" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Favicon-style mark -->
  <g transform="translate(600 210)">
    <rect x="-54" y="-54" width="108" height="108" rx="22" fill="#24283b" stroke="#414868" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#9ece6a" stroke-width="10"/>
  </g>

  <text x="600" y="340" text-anchor="middle"
        font-family="Liberation Mono, Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="72" font-weight="700" fill="#9ece6a" letter-spacing="6">OMNICAST</text>

  <text x="600" y="400" text-anchor="middle"
        font-family="Liberation Mono, Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="28" font-weight="500" fill="#7aa2f7">Alt+Space for Omarchy</text>

  <text x="600" y="460" text-anchor="middle"
        font-family="Liberation Mono, Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="22" font-weight="400" fill="#c0caf5" opacity="0.85">First we take Manhattan, then we take Berlin.</text>

  <text x="600" y="545" text-anchor="middle"
        font-family="Liberation Mono, Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="24" font-weight="500" fill="#7dcfff">omnicast.best</text>
</svg>
